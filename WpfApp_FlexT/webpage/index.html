<!doctype html>
<html lang="en" translate="no">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test flex tool</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>

<body>
  <!-- #viewport is the scrollable layer outside the flex box, controlled by FlexPanelTestData.Parent. -->
  <div id="viewport" class="viewport">
    <!-- Laid out from the FlexPanelTestData posted by WPF (see app.js). -->
    <div id="box" class="box"></div>
  </div>

  <!-- Shared by all items; app.js fills and positions it while the pointer is over an item. -->
  <div id="tip" class="tip" role="tooltip" hidden></div>

  <template id="item-template">
    <div class="item">
      <div class="item-label"></div>
    </div>
  </template>
</body>

</html>
